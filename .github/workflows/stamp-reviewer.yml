name: Stamp blog reviewer

# When a human approves a PR that touches blog/, record them as the post's
# reviewer in `reviewed_by` frontmatter and push it to the PR branch, so the
# credit lands before merge rather than as a bot commit on main.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write

# Two reviewers approving at once would otherwise both stamp from the same base
# commit, and the second push would be rejected as non-fast-forward.
concurrency:
  group: stamp-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  stamp:
    # Same-repo branches only: pushing to a fork's branch needs credentials this
    # token does not have. Bot approvals (CodeRabbit) are not a human review.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.user.login != 'coderabbitai' &&
      !endsWith(github.event.review.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stamp reviewer into blog frontmatter
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/stamp-reviewer.js

      - name: Commit and push
        # Passed via env rather than interpolated into the script: `${{ }}` inside
        # a run block is the standard Actions script-injection footgun.
        env:
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          if [ -z "$(git status --porcelain blog)" ]; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          git commit -m "chore(blog): credit ${REVIEWER} as reviewer"
          git push
